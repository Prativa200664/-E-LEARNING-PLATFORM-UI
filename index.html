<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Learning Platform</title>
  <link rel="stylesheet" href="style .css">
</head>
<body>
  <header>
    <h1>📚 My E-Learning Platform</h1>
  </header>

  <main class="container">
    <section class="course-list">
      <h2>Available Courses</h2>
      <div class="course-card">
        <h3>Web Development</h3>
        <p>Learn HTML, CSS, JavaScript, and more.</p>
        <div class="progress-bar"><div style="width: 40%"></div></div>
      </div>
      <div class="course-card">
        <h3>Python Programming</h3>
        <p>Beginner to Advanced Python tutorials.</p>
        <div class="progress-bar"><div style="width: 60%"></div></div>
      </div>
    </section>

    <section class="video-section">
      <h2>Course Video</h2>
      <iframe width="100%" height="315" src="https://www.youtube.com/embed/dD2EISBDjWM"
        title="YouTube video player" allowfullscreen></iframe>
    </section>
  </main>
</body>
</html>
